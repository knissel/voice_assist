# services/ops_agent/config.yaml

# Defines the services this agent is responsible for managing on THIS node.
# The dashboard will query this config to know what buttons to show.

services:
  whisper_server:
    type: powershell
    # Use cmd /c to set the window title so taskkill can find it reliably
    start_cmd: "Start-Process cmd -ArgumentList '/c title whisper_server && .\\.venv\\Scripts\\python whisper_server.py' -WorkingDirectory '..\\..\\' -WindowStyle Minimized"
    stop_cmd: "taskkill /F /FI \"WINDOWTITLE eq whisper_server*\""
    check_url: "http://localhost:5000/health"
    
  xtts_server:
    type: powershell
    start_cmd: "Start-Process cmd -ArgumentList '/c title xtts_server && .\\.venv\\Scripts\\python xtts_server.py' -WorkingDirectory '..\\..\\' -WindowStyle Minimized"
    stop_cmd: "taskkill /F /FI \"WINDOWTITLE eq xtts_server*\""
    check_url: "http://localhost:5001/health"

  # Example for a Systemd service (uncomment for Linux nodes)
  # voice_assistant:
  #   type: systemd
  #   service_name: voice-assistant-edge
